<div class="login-container">
  <div class="login-card">
    <!-- En-tête -->
    <div class="card-header">
      <div class="icon-container">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2>Créer un compte patient</h2>
      <p class="subtitle">Remplissez vos informations pour créer votre compte</p>
    </div>

    <!-- Formulaire -->
    <form class="patient-form">
      
      <!-- Section Informations Personnelles -->
      <div class="form-section">
        <h3 class="section-title">
          <i class="fas fa-user"></i>
          Informations personnelles
        </h3>

        <div class="form-row">
          <div class="form-group">
            <label for="prenom">
              Prénom <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="prenom" 
              placeholder="Ex: Moussa">
          </div>

          <div class="form-group">
            <label for="nom">
              Nom <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="nom" 
              placeholder="Ex: Diop">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dateNaissance">
              Date de naissance <span class="required">*</span>
            </label>
            <input 
              type="date" 
              id="dateNaissance">
          </div>

          <div class="form-group">
            <label for="sexe">
              Sexe <span class="required">*</span>
            </label>
            <select id="sexe">
              <option value="">Sélectionnez</option>
              <option value="M">Homme</option>
              <option value="F">Femme</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="adresse">
            Adresse
          </label>
          <input 
            type="text" 
            id="adresse" 
            placeholder="Ex: Liberté 6, Dakar">
        </div>
      </div>

      <!-- Section Contact -->
      <div class="form-section">
        <h3 class="section-title">
          <i class="fas fa-phone"></i>
          Coordonnées
        </h3>

        <div class="form-row">
          <div class="form-group">
            <label for="telephone">
              Téléphone <span class="required">*</span>
            </label>
            <input 
              type="tel" 
              id="telephone" 
              placeholder="Ex: 77 123 45 67">
          </div>

          <div class="form-group">
            <label for="email">
              Email <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="email" 
              placeholder="Ex: email@example.com">
          </div>
        </div>
      </div>

      <!-- Section Mot de passe -->
      <div class="form-section">
        <h3 class="section-title">
          <i class="fas fa-lock"></i>
          Sécurité
        </h3>

        <div class="form-row">
          <div class="form-group">
            <label for="password">
              Mot de passe <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="password" 
              placeholder="Minimum 8 caractères">
          </div>

          <div class="form-group">
            <label for="confirmPassword">
              Confirmer le mot de passe <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="confirmPassword" 
              placeholder="Retapez votre mot de passe">
          </div>
        </div>
      </div>

      <!-- Section Informations Médicales -->
      <div class="form-section">
        <h3 class="section-title">
          <i class="fas fa-heartbeat"></i>
          Informations médicales (optionnel)
        </h3>

        <div class="form-group">
          <label for="groupeSanguin">
            Groupe sanguin
          </label>
          <select id="groupeSanguin">
            <option value="">Sélectionnez</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="form-group">
          <label for="allergies">
            Allergies connues
          </label>
          <textarea 
            id="allergies" 
            rows="3"
            placeholder="Ex: Pénicilline, Pollen..."></textarea>
        </div>

        <div class="form-group">
          <label for="antecedents">
            Antécédents médicaux
          </label>
          <textarea 
            id="antecedents" 
            rows="3"
            placeholder="Ex: Diabète, Hypertension..."></textarea>
        </div>
      </div>

      <!-- Contact d'urgence -->
      <div class="form-section">
        <h3 class="section-title">
          <i class="fas fa-phone-square-alt"></i>
          Contact d'urgence
        </h3>

        <div class="form-row">
          <div class="form-group">
            <label for="contactUrgenceNom">
              Nom du contact
            </label>
            <input 
              type="text" 
              id="contactUrgenceNom" 
              placeholder="Ex: Fatou Diop">
          </div>

          <div class="form-group">
            <label for="contactUrgenceTel">
              Téléphone du contact
            </label>
            <input 
              type="tel" 
              id="contactUrgenceTel" 
              placeholder="Ex: 77 987 65 43">
          </div>
        </div>

        <div class="form-group">
          <label for="contactUrgenceRelation">
            Relation
          </label>
          <select id="contactUrgenceRelation">
            <option value="">Sélectionnez</option>
            <option value="conjoint">Conjoint(e)</option>
            <option value="parent">Parent</option>
            <option value="enfant">Enfant</option>
            <option value="frere-soeur">Frère/Sœur</option>
            <option value="ami">Ami(e)</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <!-- Conditions d'utilisation -->
      <div class="form-section">
        <div class="checkbox-group">
          <input type="checkbox" id="termes">
          <label for="termes">
            J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> <span class="required">*</span>
          </label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="newsletter">
          <label for="newsletter">
            Je souhaite recevoir des informations sur les services de santé
          </label>
        </div>
      </div>

      <!-- Boutons -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-user-plus"></i>
          Créer mon compte
        </button>
        <button type="button" class="btn btn-secondary">
          <i class="fas fa-times"></i>
          Annuler
        </button>
      </div>

      <!-- Lien connexion -->
      <div class="login-link">
        Vous avez déjà un compte ? <a href="#">Se connecter</a>
      </div>
    </form>
  </div>
</div>
